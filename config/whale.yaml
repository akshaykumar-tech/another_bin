# Burst bot — pump-only mode: target violent 1s legs like 14 May 15:30 (+12%).

strategy: burst

watchlist:
  mode: lowest_volume   # 300 thinnest / lowest 24h quote-volume USDT perps (violent-move targets)
  size: 300
  extra_symbols:
    - AIGENSYNUSDT

burst:
  pump_only: true
  fast_window_ms: 100
  sec_window_ms: 1000
  min_fast_move_pct: 0.5
  min_sec_move_pct: 0.4
  max_sec_move_pct: 0
  min_fast_notional_usdt: 4000
  min_sec_notional_usdt: 10000
  max_sec_notional_usdt: 45000
  side_dominance_pct: 56
  signal_cooldown_ms: 400
  # Pump filters — only early violent starts (mega trail profile)
  quiet_before_ms: 5000
  max_quiet_before_usdt: 20000
  min_volume_accel: 3.0
  min_fast_vol_share_pct: 30
  min_burst_impulse: 3.0
  max_entry_sec_move_pct: 0.75
  max_fast_move_pct: 0.58
  min_momentum_align: 0.95
  trend_window_ms: 60000
  max_counter_trend_pct: 1.5
  cascade_window_ms: 3000
  min_cascade_move_pct: 2.5
  min_cascade_notional_usdt: 12000
  max_cascade_move_pct: 6.0
  # Pre-trade: dead + flat tape before burst (skip chop / late chase)
  pre_trade_enabled: true
  pre_trade_window_ms: 60000
  max_quiet_60s_usdt: 40000
  max_range_60s_pct: 0.75
  max_prior_1s_move_60s_pct: 0.35
  max_trades_60s: 0

risk:
  normal_risk_percent: 2.0
  mega_risk_percent: 5.0
  max_position_percent: 5.0
  stop_loss_percent: 1.5
  take_profit_percent_1: 3.0
  take_profit_percent_2: 6.0
  partial_exit_fraction: 0.5
  mega_trail_activate_pct: 2.0
  mega_trail_distance_pct: 2.0
  mega_take_profit_pct: 12.0
  mega_stop_loss_percent: 2.0
  mega_partial_min_pct: 5.0
  mega_trail_widen_peak_pct: 8.0
  mega_trail_widen_dist_pct: 3.5
  mega_trail_min_hold_ms: 2000

symbols_per_connection: 80
dry_run: true
capital_usdt: 1000
cooldown_sec: 1800          # 30 min per symbol — one pump episode
max_open_positions: 1

websocket:
  # Root only — code routes aggTrade → /market, depth → /public (Binance WS migration).
  url: "wss://fstream.binance.com"
