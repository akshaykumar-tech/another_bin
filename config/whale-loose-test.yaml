# LOOSE LIVE TEST ONLY — verify WS + BURST + DRY_RUN logs (not for production).
# Run: go run ./cmd/whale -config config/whale-loose-test.yaml
# Expect several BURST lines within ~2 minutes on 80 thin symbols.

strategy: burst

watchlist:
  mode: lowest_volume
  size: 80                    # smaller list = faster connect, still plenty of ticks
  extra_symbols:
    - AIGENSYNUSDT

burst:
  pump_only: false              # OFF = no pump/pre-trade gates on 1s burst path
  fast_window_ms: 100
  sec_window_ms: 1000
  min_fast_move_pct: 0.20       # was 0.50
  min_sec_move_pct: 0.15        # was 0.40
  max_sec_move_pct: 0
  min_fast_notional_usdt: 300   # was 4000
  min_sec_notional_usdt: 800    # was 10000
  max_sec_notional_usdt: 0      # off
  side_dominance_pct: 52
  signal_cooldown_ms: 150
  quiet_before_ms: 0
  max_quiet_before_usdt: 0
  min_volume_accel: 0
  min_fast_vol_share_pct: 0
  min_burst_impulse: 0
  max_entry_sec_move_pct: 0
  max_fast_move_pct: 0
  min_momentum_align: 0
  trend_window_ms: 0
  max_counter_trend_pct: 0
  cascade_window_ms: 3000
  min_cascade_move_pct: 0.8
  min_cascade_notional_usdt: 2000
  max_cascade_move_pct: 0
  pre_trade_enabled: false

risk:
  normal_risk_percent: 2.0
  mega_risk_percent: 5.0
  max_position_percent: 5.0
  stop_loss_percent: 1.5
  take_profit_percent_1: 3.0
  take_profit_percent_2: 6.0
  partial_exit_fraction: 0.5
  mega_trail_activate_pct: 2.0
  mega_trail_distance_pct: 2.0
  mega_take_profit_pct: 12.0
  mega_stop_loss_percent: 2.0
  mega_partial_min_pct: 5.0
  mega_trail_widen_peak_pct: 8.0
  mega_trail_widen_dist_pct: 3.5
  mega_trail_min_hold_ms: 2000

symbols_per_connection: 80
dry_run: true
capital_usdt: 1000
cooldown_sec: 10               # same symbol can re-fire quickly for testing
max_open_positions: 5

websocket:
  # Root URL; code subscribes aggTrade on /market (Binance routed WS).
  url: "wss://fstream.binance.com"
